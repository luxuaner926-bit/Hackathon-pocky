  .why { font-size: 0.85rem; }
  .map { display: flex; flex-direction: column; gap: 8px; }
  .map img { border-radius: 14px; display: block; width: 100%; border: 1px solid var(--line); }
  .map-key { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.78rem; }

  .thumbs img { width: 48px; height: 48px; border-radius: 6px; border: 3px solid var(--sun); flex: none; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px; }
  .stat b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 0.72rem; color: var(--muted); }
  .seg { display: flex; flex-direction: column; gap: 8px; font-size: 0.85rem; }

  pre.json { margin: 0; font-size: 0.7rem; background: var(--photo); border-radius: 10px; padding: 10px; overflow-x: auto; }
  .log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; }
  .log li { display: flex; gap: 8px; justify-content: space-between; border-bottom: 1px solid var(--line); padding-bottom: 6px; }

const RISK = { low: "Low risk", medium: "Medium risk", high: "High risk" };

/* Risk score: 2 per set of steps, up to 3 for little shade, 1-2 for long sunny stretches,
   1-2 for long walks, 1 for >300 m beside a main road. Needs the resident ticked count double
   when ranking; the Low/Medium/High label uses the plain score so it means the same for everyone. */
function assess(w) {
  const known = w.sky.filter(v => v !== null);
  const shadePct = Math.round(100 * known.filter(v => v < SHADE_SKY).length / known.length);
  let run = 0, longest = 0;
  for (const v of w.sky) { if (v !== null && v >= SHADE_SKY) longest = Math.max(longest, ++run); else run = 0; }
  const sunM = longest * SAMPLE_M, n = w.stairsAt.length;
  const parts = [
    { need: "steps", pts: 2 * n, why: n ? `${n} set${n > 1 ? "s" : ""} of steps` : "" },
    { need: "shade", pts: +(3 * (1 - shadePct / 100)).toFixed(1), why: shadePct < 50 ? `only ${shadePct}% in shade` : "" },
    { need: "shade", pts: sunM > 300 ? 2 : sunM > 150 ? 1 : 0, why: sunM > 150 ? `${sunM} m in the sun without a break` : "" },
    { need: "short", pts: w.distance > 1200 ? 2 : w.distance > 900 ? 1 : 0, why: w.distance > 900 ? `long walk (${w.distance} m)` : "" },
    { need: null, pts: w.mainRoadM > 300 ? 1 : 0, why: w.mainRoadM > 300 ? `${w.mainRoadM} m beside a main road` : "" }
  ];
  const raw = +parts.reduce((t, p) => t + p.pts, 0).toFixed(1);
  const weighted = +parts.reduce((t, p) => t + p.pts * (p.need && state.needs[p.need] ? 2 : 1), 0).toFixed(1);
  return {
    shadePct, sunM, raw, weighted, stairs: n, minutes: Math.round(w.distance / 60),
    level: raw >= 8 ? "high" : raw >= 4 ? "medium" : "low",
    reasons: parts.filter(p => p.why).map(p => p.why),
    coverage: Math.round(100 * known.length / w.sky.length)
  };
}
function rankedWays() {
  return WAYS.map(w => ({ w, a: assess(w) })).sort((x, y) => x.a.weighted - y.a.weighted || x.w.distance - y.w.distance);
}
function currentWay() { const list = rankedWays(); return list.find(x => x.w.key === state.way) || list[0]; }

function ribbon(w) {
  return `<div class="ribbon" role="img" aria-label="Shade along the way">
      ${w.sky.map(v => `<span class="${v === null ? "na" : v < SHADE_SKY ? "shade" : "sun"}"></span>`).join("")}
      ${w.stairsAt.map(m => `<i style="left:${(100 * m / w.distance).toFixed(1)}%"></i>`).join("")}
    </div>
    <div class="legend"><span><i style="background:var(--accent)"></i>Shade</span><span><i style="background:var(--sun)"></i>Sun</span><span><i style="background:var(--line)"></i>No photo</span><span><i class="tri"></i>Steps</span></div>`;
}
function wayCard({ w, a }, opts = {}) {
  return `<div class="card">
    <div class="way-head"><span><b>${w.name}</b><br><span class="muted" style="font-size:.85rem">${w.note}</span></span><span class="risk ${a.level}">${RISK[a.level]}</span></div>
    ${opts.rec ? `<p><span class="chip ok">Best for what matters to you</span></p>` : ""}
    <div class="metrics">
      <div class="metric${w.distance > 1200 ? " bad" : ""}"><b>${w.distance} m</b><span>about ${a.minutes} min, gentle pace</span></div>
      <div class="metric${a.stairs ? " bad" : ""}"><b>${a.stairs || "No"}</b><span>set${a.stairs === 1 ? "" : "s"} of steps</span></div>
      <div class="metric${a.shadePct < 30 ? " bad" : ""}"><b>${a.shadePct}%</b><span>in shade</span></div>
      <div class="metric${a.sunM > 300 ? " bad" : ""}"><b>${a.sunM} m</b><span>longest stretch in sun</span></div>
    </div>
    ${ribbon(w)}
    ${a.reasons.length ? `<p class="muted why">Watch out: ${a.reasons.join(", ")}.</p>` : ""}
    ${opts.choose ? `<button class="btn ${opts.rec ? "primary" : "secondary"}" data-way="${w.key}">Choose this way</button>` : ""}
  </div>`;
}

/* ---------- State ---------- */
const SCALES = [1, 1.15, 1.3, 1.45];
const state = { screen: "home", step: 0, scaleIdx: 0, audio: false, flags: new Set(), reports: [], way: null, needs: { steps: true, shade: true, short: true } };
const view = document.getElementById("view");
const overlay = document.getElementById("overlay");

try {
  const saved = JSON.parse(localStorage.getItem("ss-prefs") || "{}");
  if (Number.isInteger(saved.scaleIdx)) state.scaleIdx = Math.min(saved.scaleIdx, SCALES.length - 1);
  if (typeof saved.audio === "boolean") state.audio = saved.audio;
  if (saved.needs) Object.keys(state.needs).forEach(k => { if (typeof saved.needs[k] === "boolean") state.needs[k] = saved.needs[k]; });
} catch (e) {}
function savePrefs() { try { localStorage.setItem("ss-prefs", JSON.stringify({ scaleIdx: state.scaleIdx, audio: state.audio, needs: state.needs })); } catch (e) {} }
function applyPrefs() {
  document.documentElement.style.setProperty("--scale", SCALES[state.scaleIdx]);
  document.getElementById("t-audio").setAttribute("aria-pressed", String(state.audio));
}

function speak(text, force) {
  if (!state.audio && !force) return;
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.9; u.lang = "en-SG"; speechSynthesis.speak(u); } catch (e) {}
}
function log(kind, detail) {
  const t = new Date();
  state.reports.push({ time: t.toTimeString().slice(0, 5), kind, detail });
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function photoHTML(step, big) {
  const h = step.highlight;
  const inner = step.photo
    ? `<img src="${esc(step.photo)}" alt="${esc(step.point)}">${step.credit ? `<span class="credit">${esc(step.credit)}</span>` : ""}`
    : `<div class="shot">${I.camera}<span><b>Photo to take:</b> ${esc(step.shot)}</span></div>`;
  return `<div class="photo${big ? " big" : ""}" role="img" aria-label="Photo of ${esc(step.point)}. Look for ${esc(step.landmark)}.">
    ${inner}
    <div class="hl" style="left:${h.x}%;top:${h.y}%;width:${h.w}%;height:${h.h}%"><b>Look here</b></div>
  </div>`;
}

    ${body}
    ${mode ? `<button class="btn quiet" data-sheet="menu">${I.back} Other options</button>` : ""}
    <button class="btn primary" data-sheet="close">I'm okay now</button>
  </div></div>`;
  overlay.querySelector(".sheet button")?.focus();
}
function closeSheet() { overlay.innerHTML = ""; }

/* ---------- Navigation ---------- */
function go(screen) {
  if (screen.startsWith("step")) { state.step = Number(screen.slice(4)) || 0; screen = "step"; }
  state.screen = screen;
  view.innerHTML = screens[screen]();
  window.scrollTo(0, 0);
  if (screen === "step") { const s = ROUTE.steps[state.step]; speak(`Step ${state.step + 1}. Look for ${s.landmark}. ${s.instruction}`); }
  if (screen === "arrive") speak("You have arrived at the " + ROUTE.to);
}

view.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.dest) { closeSheet(); state.way = null; return go(DESTINATIONS.find(d => d.key === b.dataset.dest).ready ? "preview" : "notReady"); }
  if (b.dataset.way) { state.way = b.dataset.way; return go(b.dataset.then || "preview"); }
  if (b.dataset.go) return go(b.dataset.go);
  if (b.dataset.need) {
    const k = b.dataset.need;
    state.needs[k] = !state.needs[k];
    b.setAttribute("aria-pressed", String(state.needs[k]));
    savePrefs();
    return;
  }
  if (b.dataset.flag) {
    const k = b.dataset.flag;
    state.flags.has(k) ? state.flags.delete(k) : state.flags.add(k);
    b.setAttribute("aria-pressed", String(state.flags.has(k)));
    return;
  }
  const s = ROUTE.steps[state.step];
  switch (b.dataset.act) {
    case "start": return currentWay().w.guided ? go("step0") : go("notGuided");
    case "needs-done": state.way = null; return go("preview");
    case "next": return state.step < ROUTE.steps.length - 1 ? go("step" + (state.step + 1)) : go("arrive");
    case "prev": return state.step > 0 ? go("step" + (state.step - 1)) : go("preview");
    case "unsure": log("Tapped “I'm not sure”", s.id); return openSheet();
    case "read": return speak(`Look for ${s.landmark}. ${s.instruction}`, true);
    case "send": state.flags.forEach(f => log("Hard to follow", f)); state.flags.clear(); return go("thanks");
    case "skip": state.flags.clear(); return go("thanks");
  }
});

overlay.addEventListener("click", e => {
  const t = e.target.closest("[data-sheet]"); if (!t) return;
  if (t.classList.contains("sheet-wrap") && e.target !== t) return;
  const a = t.dataset.sheet;
  if (a === "close") return closeSheet();
  if (a === "menu") return openSheet();
  if (a === "back") { closeSheet(); return state.step > 0 ? go("step" + (state.step - 1)) : go("preview"); }
  if (a === "read-hint") return speak(ROUTE.steps[state.step].hint, true);
  openSheet(a);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && overlay.innerHTML) closeSheet(); });

document.getElementById("t-smaller").onclick = () => { state.scaleIdx = Math.max(0, state.scaleIdx - 1); applyPrefs(); savePrefs(); };
document.getElementById("t-bigger").onclick = () => { state.scaleIdx = Math.min(SCALES.length - 1, state.scaleIdx + 1); applyPrefs(); savePrefs(); };
document.getElementById("t-audio").onclick = () => {
  state.audio = !state.audio; applyPrefs(); savePrefs();
  if (state.audio) speak("Spoken directions on.", true); else try { speechSynthesis.cancel(); } catch (e) {}
};

applyPrefs();
go("home");
</script>

</html>
